name: Python contracts and API tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m fourth_down --check
      - run: python -m compileall -q fourth_down scripts cloud
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m scripts.check_browser_engine
      - run: python -m scripts.build_site
      - run: git diff --exit-code -- site/data.js
